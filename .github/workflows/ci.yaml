name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the minimum the template supports; 22 is current LTS.
        node: ["20", "22"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Core lint
        run: yarn core:lint

      - name: Core type check
        run: yarn core:check-types

      - name: Core tests
        run: yarn core:test:coverage

      - name: README step reference is up to date
        run: yarn core:docs:check

      - name: Next.js lint
        run: yarn next:lint

      - name: Next.js type check
        run: yarn next:check-types

      - name: Next.js API tests
        run: yarn next:test

      - name: Hardhat lint
        run: yarn hardhat:lint

      - name: Hardhat type check
        run: yarn hardhat:check-types

      - name: Hardhat compile
        run: yarn hardhat:compile

      - name: Next.js build
        run: yarn next:build

      # The browser tests do not depend on the Node version: run them once.
      - name: Install Chromium
        if: matrix.node == '22'
        run: yarn next:e2e:install

      - name: Launch Studio in a browser
        if: matrix.node == '22'
        run: yarn next:e2e

      - name: Upload the Playwright traces
        if: failure() && matrix.node == '22'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: packages/nextjs/test-results
          if-no-files-found: ignore

      - name: Upload coverage
        if: matrix.node == '20'
        uses: actions/upload-artifact@v7
        with:
          name: core-coverage
          path: packages/launchblocks/coverage/lcov.info
          if-no-files-found: error

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          base=https://github.com/gitleaks/gitleaks/releases/download/v$VERSION
          curl -sSfLO "$base/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/gitleaks_${VERSION}_checksums.txt" | grep "linux_x64.tar.gz" | sha256sum --check
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks

      - name: Scan every commit
        # --redact keeps anything it finds out of the public log.
        run: ./gitleaks git . --redact --verbose

  contracts:
    name: Contracts on Hedera fork
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run Hardhat node and deploy contracts
        run: |
          yarn hardhat:chain &
          timeout 60s bash -c 'until curl -s -X POST http://127.0.0.1:8545 -H "Content-Type: application/json" --data "{\"jsonrpc\":\"2.0\",\"method\":\"web3_clientVersion\",\"params\":[],\"id\":1}" >/dev/null; do sleep 2; done'
          yarn workspace @sh/hardhat deploy --network localhost

      - name: Hardhat tests
        run: yarn hardhat:test
